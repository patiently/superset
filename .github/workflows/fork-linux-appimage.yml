name: Fork Linux AppImage Release

# Builds the Linux AppImage the way build-desktop.yml's build-linux job does,
# minus production secrets, after proving the GPU regression test goes red
# without the fix and green with it. Publishes release desktop-v<VERSION> with
# the upstream asset name.

on:
  push:
    branches:
      - build/linux-gpu-acceleration

permissions:
  contents: write

concurrency:
  group: fork-linux-appimage
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and release - Linux (x64)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Resolve fork version
        id: version
        working-directory: apps/desktop
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::Version '$VERSION' has characters outside [0-9A-Za-z.+-]"
            exit 1
          fi
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is a plain upstream-shaped version; fork builds need a fork-specific suffix"
            exit 1
          fi
          if gh release view "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release desktop-v$VERSION already exists; bump the version instead of replacing a published asset"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen --ignore-scripts

      - name: Build desktop dependencies
        run: bunx turbo run build build:types --filter='@superset/desktop^...'

      - name: Regression test fails without the fix
        working-directory: apps/desktop
        env:
          TEST_ONLY_SHA: e0b541228b770b2936f7e8e25e2b963775a5b66b
          SETUP: src/lib/electron-app/factories/app/setup.ts
        run: |
          set -u
          git fetch --depth=1 origin "$TEST_ONLY_SHA"
          cp "$SETUP" /tmp/setup.fixed.ts
          git show "$TEST_ONLY_SHA:apps/desktop/$SETUP" > "$SETUP"
          grep -n "disableHardwareAcceleration" "$SETUP"
          set +e
          bun test src/lib/electron-app/factories/app/setup.test.ts 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          cp /tmp/setup.fixed.ts "$SETUP"
          git diff --exit-code -- "$SETUP"
          if [[ $status -eq 0 ]]; then
            echo "::error::Regression test passed against the pre-fix setup.ts"
            exit 1
          fi
          if ! grep -q "not.toMatch" /tmp/red.log || ! grep -q "0 pass" /tmp/red.log || grep -q "Unhandled error" /tmp/red.log; then
            echo "::error::Regression test failed for a reason other than the GPU-policy assertion"
            exit 1
          fi
          echo "Regression test fails against the pre-fix setup.ts, as expected (exit $status)"

      - name: Regression test passes with the fix
        working-directory: apps/desktop
        run: bun test src/lib/electron-app/factories/app/setup.test.ts

      - name: Desktop test suite
        working-directory: apps/desktop
        run: bun test

      - name: Lint
        run: bun run lint

      - name: Desktop typecheck
        working-directory: apps/desktop
        run: bun run typecheck

      - name: Install Linux native build deps
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev

      - name: Install desktop native dependencies
        working-directory: apps/desktop
        run: bun run install:deps

      - name: Clean dev folder
        working-directory: apps/desktop
        run: bun run clean:dev

      - name: Generate file icons
        working-directory: apps/desktop
        run: bun run generate:icons

      - name: Compile app with electron-vite
        working-directory: apps/desktop
        env:
          SUPERSET_WORKSPACE_NAME: superset
          TARGET_ARCH: x64
        run: bun run compile:app

      - name: Build Electron app
        working-directory: apps/desktop
        run: bun run package -- --publish never --config electron-builder.ts

      - name: Verify AppImage
        id: asset
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -la release
          ASSET="superset-${VERSION}-x86_64.AppImage"
          test -f "release/$ASSET" || {
            echo "::error::Expected release/$ASSET"
            exit 1
          }
          CLI_BIN=$(find release -path "*/resources/resources/bin/superset" -type f -perm -111 | head -1)
          test -n "$CLI_BIN" || {
            echo "::error::Bundled Superset CLI missing or not executable"
            exit 1
          }
          "$CLI_BIN" --version
          SHA256=$(sha256sum "release/$ASSET" | cut -d' ' -f1)
          echo "name=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "$ASSET sha256=$SHA256"

      - name: Publish release
        working-directory: apps/desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh release create "desktop-v$VERSION" "release/$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Superset $VERSION (fork)" \
            --latest=false \
            --notes "Superset upstream main plus fix(desktop): stop disabling GPU acceleration on Linux (#5948). Linux x64 AppImage only, for testing.

          sha256: \`$SHA256\`  $ASSET"

      - name: Verify release asset name and unauthenticated download
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
          SHA256: ${{ steps.asset.outputs.sha256 }}
        run: |
          set -euo pipefail
          PUBLISHED=$(gh release view "desktop-v$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "Published assets: $PUBLISHED"
          if ! grep -Fxq "$ASSET" <<<"$PUBLISHED"; then
            echo "::error::Release asset is not named exactly '$ASSET' (GitHub may have rewritten characters); got: $PUBLISHED"
            exit 1
          fi
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/desktop-v$VERSION/$ASSET"
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/downloaded.AppImage "$URL"
          echo "$SHA256  /tmp/downloaded.AppImage" | sha256sum -c -
          echo "Verified: $URL"
